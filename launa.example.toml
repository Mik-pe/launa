# Launa device configuration
#
# Copy this file to launa.toml and fill in your values.
# launa.toml is gitignored -- your secrets never leave your machine.
#
# All xtask commands will fail with a clear error if required fields
# are missing or still set to placeholder values.
#
# Provisioning (one-time per device):
#   cargo xtask provision    — burns AES-128 key to ESP32 eFuse BLOCK3 for encrypted NVS

[wifi]
ssid = "YourWiFiName"          # required
password = "YourWiFiPassword"  # required

[mqtt]
host = "192.168.1.100"         # required — IP or hostname of your MQTT broker
port = 1883                    # optional, default 1883
user = ""                      # optional
password = ""                  # optional

[device]
id = "launa_spa"               # required — unique ID for HA entity prefixes
serial_port = ""               # optional — auto-detected if empty (macOS: /dev/cu.usb*, Linux: /dev/ttyUSB*)

[ota]
serve_port = 8081              # optional, default 8081 — port for local OTA HTTP server
host = ""                      # optional, default empty (uses mqtt.host) — OTA server address if different from MQTT broker
