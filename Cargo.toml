[workspace]
resolver = "2"
members = [
    "crates/launa-protocol",
    "crates/launa-hal",
    "crates/launa-mqtt",
    "crates/launa-ota",
    "crates/launa-esp-ota",
    "crates/launa-core",
    "crates/launa-sim",
    "crates/launa-integration-tests",
    "crates/launa-server",
    "xtask",
]
exclude = [
    # The ESP32 app targets xtensa-esp32-none-elf and uses esp-hal + embassy.
    # Build separately with: cd app && cargo build
    "app",
    # RS-485 debugger binary for transceiver testing.
    # Build with: cd app-rs485-debugger && cargo build
    "app-rs485-debugger",
    # Spa emulator binary — simulates Balboa BP6013G1 on ESP32 over RS-485.
    # Build with: cd app-spa-emulator && cargo build
    "app-spa-emulator",
    # Passive RS-485 bus sniffer — decodes and publishes frames to MQTT.
    # Build with: cd app-sniffer && cargo build
    "app-sniffer",
    # Shared code for ESP32 app crates (WiFi, MQTT transport, utilities).
    "app-common",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mik-pe"]
license = "MIT"

[workspace.dependencies]
log = "0.4"
thiserror = { version = "2", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

