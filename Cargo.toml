[workspace]
resolver = "2"
members = [
    "crates/launa-protocol",
    "crates/launa-hal",
    "crates/launa-mqtt",
    "crates/launa-ota",
    "crates/launa-esp-ota",
    "crates/launa-core",
    "crates/launa-sim",
    "crates/launa-integration-tests",
    "crates/launa-server",
    "xtask",
]
exclude = [
    # The ESP32 app targets xtensa-esp32-none-elf and uses esp-hal + embassy.
    # Build separately with: cd app && cargo build
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mik-pe"]
license = "MIT"

[workspace.dependencies]
log = "0.4"
thiserror = { version = "2", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc = "3"
byteorder = { version = "1", default-features = false }
heapless = "0.8"
embedded-io = "0.6"
embedded-io-async = "0.6"
