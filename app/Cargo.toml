[package]
name = "launa-app"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
esp-hal = { version = "1.0", features = ["esp32", "unstable"] }
esp-hal-embassy = { version = "0.9", features = ["esp32", "executors"] }
esp-radio = { version = "0.17", features = ["esp32", "unstable", "wifi", "smoltcp", "log-04"] }
esp-alloc = "0.7"
esp-nvs = { version = "0.4", features = ["esp32"] }
esp-storage = { version = "0.5", features = ["esp32"] }
esp-hal-ota = { version = "0.4", features = ["esp32", "log"] }

embassy-executor = { version = "0.7", features = ["task-arena-size-65536"] }
embassy-time = "0.4"
embassy-net = { version = "0.7", features = ["tcp", "dhcpv4", "medium-ethernet"] }
embassy-sync = "0.6"
embassy-futures = "0.2"

embedded-io-async = "0.6"

rust-mqtt = { version = "0.5", default-features = false, features = ["v5", "alloc", "log-level-info"] }

static_cell = "2"
log = "0.4"

launa-protocol = { path = "../crates/launa-protocol" }
launa-hal = { path = "../crates/launa-hal", default-features = false }
launa-mqtt = { path = "../crates/launa-mqtt", default-features = false }
launa-ota = { path = "../crates/launa-ota" }
