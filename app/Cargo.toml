[package]
name = "launa-app"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = []
sniff = []
hw-test = []

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "s"

# esp-storage requires opt-level >= 2; override it even in dev builds
[profile.dev.package.esp-storage]
opt-level = 3

# esp-radio requires opt-level >= 2 for WiFi to work reliably
[profile.dev.package.esp-radio]
opt-level = 3

[dependencies]
esp-hal = { version = "1.0.0", features = ["esp32", "unstable"] }
esp-rtos = { version = "0.2.0", features = ["esp32", "embassy", "log-04"] }
esp-radio = { version = "0.17", features = ["esp32", "unstable", "wifi", "smoltcp", "log-04"] }
esp-alloc = "0.9"
esp-nvs = { version = "0.4", features = ["esp32"] }
esp-storage = { version = "0.8", features = ["esp32"] }
esp-backtrace = { version = "0.18", features = ["esp32", "println"] }
esp-println = { version = "0.16", default-features = false, features = ["esp32", "auto"] }

embassy-executor = "0.9"
embassy-time = "0.5"
embassy-net = { version = "0.7", features = ["tcp", "dhcpv4", "medium-ethernet", "dns"] }
embassy-sync = "0.7"
embassy-futures = "0.1"

embedded-io-async = "0.6"

static_cell = "2"
log = "0.4"

launa-protocol = { path = "../crates/launa-protocol" }
launa-hal = { path = "../crates/launa-hal", default-features = false }
launa-mqtt = { path = "../crates/launa-mqtt", default-features = false }
launa-ota = { path = "../crates/launa-ota" }
launa-esp-ota = { path = "../crates/launa-esp-ota" }
launa-core = { path = "../crates/launa-core" }
