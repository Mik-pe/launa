[package]
name = "launa-app"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = ["remote-log", "serial-log"]
serial-log = []
remote-log = []

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "s"

# esp-storage requires opt-level >= 2; override it even in dev builds
[profile.dev.package.esp-storage]
opt-level = 3

# esp-radio requires opt-level >= 2 for WiFi to work reliably
[profile.dev.package.esp-radio]
opt-level = 3

[dependencies]
esp-hal = { version = "=1.1.0-rc.0", features = ["esp32", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp32", "embassy", "esp-radio", "esp-alloc", "log-04"] }
esp-radio = { version = "0.18.0", features = ["esp32", "unstable", "wifi", "log-04"] }
esp-alloc = "0.10"
esp-nvs = { path = "vendor/esp-nvs-vendor/esp-nvs", features = ["esp32"] }
esp-storage = { version = "0.9", features = ["esp32"] }
esp-backtrace = { version = "0.19", features = ["esp32", "println"] }
esp-println = { version = "0.17", default-features = false, features = ["esp32", "log-04", "uart"] }
esp-bootloader-esp-idf = { version = "0.5", default-features = false, features = ["esp32"] }

embassy-executor = "0.10"
embassy-time = "0.5"
embassy-net = { version = "0.9", features = ["tcp", "dhcpv4", "dhcpv4-hostname", "medium-ethernet", "dns"] }
heapless = "0.9"
embassy-sync = "0.8"
embassy-futures = "0.1"

embedded-io-async = "0.7"

static_cell = "2"
log = "0.4"

launa-protocol = { path = "../crates/launa-protocol" }
launa-hal = { path = "../crates/launa-hal", default-features = false }
launa-mqtt = { path = "../crates/launa-mqtt", default-features = false }
launa-ota = { path = "../crates/launa-ota" }
launa-esp-ota = { path = "../crates/launa-esp-ota" }
launa-core = { path = "../crates/launa-core" }
launa-sim = { path = "../crates/launa-sim", default-features = false }
